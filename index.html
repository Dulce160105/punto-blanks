function mkSale(o){const ts=new Date().toISOString(),s={id:nid(),no:'F-'+String(++S.seqF).padStart(5,'0'),date:today(),ts,cli:o.c?o.c.id:0,name:o.name,nit:o.nit,items:o.items.map(i=>({...i})),sub:o.sub,ds:o.ds,iva:o.iva,total:o.total,paid:o.paid,pay:o.pay,due:addD(today(),o.c?o.c.days||30:0),status:'EMITIDA'};

function cobrar(){const t=tot();if(!S.cart.length)return msg('Carrito vacío');if(!S.caja){msg('Abra la caja primero');return go('caja')}
const ci=custInfo();if(ci.err)return msg(ci.err);const pay=tk().pay;let c=ci.c;if(pay==='credito'&&(ci.nit==='CF'||ci.name==='CONSUMIDOR FINAL'))return msg('El crédito requiere nombre y NIT del cliente');
const se=stockErr(S.cart);if(se)return msg(se);let paid=t.total;
if(pay==='credito'){paid=Math.min(t.total,Math.max(0,r2(nn(tk().rec)||0)));const owe=r2((c?cliSaldo(c.id):0)+t.total-paid);if(c&&c.limit&&owe>c.limit)return msg('Excede límite de crédito '+Q(c.limit)+' (quedaría '+Q(owe)+')')}
const run=()=>{if(pay==='credito')c=ensureCli(ci);const s=mkSale({c,name:ci.name,nit:ci.nit,items:S.cart,sub:t.sub,ds:t.ds,iva:t.iva,total:t.total,paid,pay,method:pay==='credito'?'efectivo':pay});resetTk();persist();render();msg('Venta '+s.no+' registrada: '+Q(s.total))};
if(t.net<sum(S.cart,i=>i.cost*i.qty))ask('Venta por debajo del costo',[],()=>{run()},'Continuar de todos modos');else run()}
function cotizar(){if(!S.cart.length)return msg('Carrito vacío');const ci=custInfo();if(ci.err)return msg(ci.err);const t=tot();S.quotes.push({id:nid(),no:'C-'+String(++S.seqC).padStart(4,'0'),date:today(),exp:addD(today(),30),cli:ci.c?ci.c.id:0,name:ci.name,nit:ci.nit,items:S.cart.map(i=>({...i})),sub:t.sub,ds:t.ds,iva:t.iva,total:t.total,status:'VIGENTE'});resetTk();log('Cotización emitida');persist();render();msg('Cotización guardada en Cotizaciones')}
T.cot=()=>`<div class="c">${tbl(['No.','Fecha','Vence','Cliente','#Total','Estado',''],S.quotes.slice().reverse().map(q=>{const ex=q.status==='VIGENTE'&&daysTo(q.exp)<0;return[q.no,q.date,q.exp,esc(q.name),Q(q.total),`<span class="tag ${ex?'er':''}">${ex?'VENCIDA':q.status}</span>`,q.status==='VIGENTE'?`<button class="b s ok" onclick="qPay(${q.id},0)">ABONAR / A CxC</button> <button class="b s pr" onclick="qPay(${q.id},1)">CANCELAR TOTAL</button> <button class="b s" onclick="convQ(${q.id})">AL CARRITO</button> <button class="b s" onclick="printQ(${q.id})">🖨</button> <button class="b s er" onclick="discQ(${q.id})">ELIMINAR</button>`:`<button class="b s er" onclick="discQ(${q.id})">ELIMINAR</button>`]}))}</div>`;
function qPay(id,full){const q=S.quotes.find(x=>x.id===id);if(!S.caja){msg('Abra caja para cobrar');return go('caja')}const se=stockErr(q.items);if(se)return msg(se);
ask(full?'Cancelar cuenta total '+Q(q.total):'Abono inicial · el saldo pasa a Por cobrar',(full?[]:[{k:'a',l:'Monto del abono (0 = solo crédito)',t:'number',v:0}]).concat([{k:'m',l:'Método de pago',o:PAY}]),v=>{
const a=full?q.total:r2(nn(v.a)||0);if(a<0||a>q.total)return'Monto inválido (máx '+Q(q.total)+')';const nit=q.nit||'CF';let c=S.cli.find(x=>x.id===q.cli);const done=full||a>=q.total;
if(!done){if(q.name==='CONSUMIDOR FINAL'||nit==='CF')return'Para pasar a Por cobrar la cotización necesita nombre y NIT';const owe=r2((c?cliSaldo(c.id):0)+q.total-a);if(c&&c.limit&&owe>c.limit)return'Excede límite de crédito '+Q(c.limit);c=ensureCli({c,name:q.name,nit})}
const s=mkSale({c,name:q.name,nit,items:q.items,sub:q.sub??q.total,ds:q.ds||0,iva:q.iva??r2(q.total-q.total/(1+S.cfg.iva/100)),total:q.total,paid:a,pay:done?v.m:'credito',method:v.m});q.status='CONVERTIDA';q.sale=s.no;persist();render();msg(done?'Cuenta cancelada: '+s.no+' en Historial de ventas':'Abono '+Q(a)+' · saldo '+Q(sal(s))+' pasó a Por cobrar')},full?'Cobrar total':'Registrar')}

function saveInv(){const g=k=>cl($('#i_'+k).value,60),sku=g('sku').toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!sku||!g('desc'))return msg('SKU y descripción son obligatorios');const cost=nn(g('cost'))||0,price=nn(g('price'))||0;if(price<=0)return msg('Precio inválido');if(S.cat.some(c=>c.sku===sku))return msg('Ese SKU ya existe en el Catálogo');const old=S.inv.find(i=>i.sku===sku),svc=$('#i_svc').checked?1:0,stock=svc?0:ni(g('stock'))||0;

const TG=[['fijo','Fijo'],['variable','Variable'],['otro','Otro']],gmNet=g=>g.amt-g.iva;

const expSplit=()=>{const m=S.gem.filter(g=>g.date.startsWith(month())),t=x=>sum(m.filter(g=>g.tipo===x),gmNet);return{f:t('fijo'),v:t('variable'),o:t('otro')}};
function ohCalc(){const ex=S.gem.filter(g=>g.date.startsWith(OM)),on=g=>OX[g.id]??(g.tipo==='fijo'),f=sum(ex.filter(g=>g.tipo==='fijo'&&on(g)),gmNet),v=sum(ex.filter(g=>g.tipo!=='fijo'&&on(g)),gmNet),h=Math.max(OH,1),k=OT/60,fa=r2(f/h*k),va=r2(v/h*k);return{f,v,rate:r2((f+v)/h),fa,va,oh:r2(fa+va)}}

let CL=[],CY=1,CM=30,CI='12%';
function openCalc(){const d=$('#dlg');d.innerHTML=`<div style="max-width:560px;max-height:92vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><b>🧮 Receta y costeo</b><button class="b s" onclick="$('#dlg').classList.remove('show')">✕</button></div>

function calcAdd(){const i=S.inv.find(x=>x.sku===$('#cs').value),q=nn($('#cq').value);if(!i||!(q>0))return msg('Elija insumo y cantidad');const l=CL.find(x=>x.sku===i.sku);if(l)l.q=r2(l.q+q);else CL.push({sku:i.sku,n:i.desc,c:i.cost,q});drawCL()}

async function pull(){try{const{data,error}=await SB.from('app_state').select('data,updated_at').eq('user_id',USER.id).maybeSingle();if(error)throw error;
const dirty=localStorage.getItem(DRT)==='1',lts=localStorage.getItem(LTS);
if(!data){await pushNow();return}

if(data.updated_at===lts){if(dirty)await pushNow();else setSync('ok');return}
if(!dirty){adopt(data);return}

async function boot(){cloudOn=!!(CFG.url&&CFG.key);if(!cloudOn){setSync('local');render();return}
if(!window.supabase){showAuth('No se pudo cargar Supabase. Revise su conexión.',true);return}
SB=window.supabase.createClient(CFG.url,CFG.key);SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&USER){USER=null;showAuth('Su sesión terminó. Inicie sesión de nuevo.')}});
try{const{data}=await SB.auth.getSession();if(data&&data.session){USER=data.session.user;await start()}else showAuth()}catch(e){showAuth('No se pudo conectar. Revise su internet.',true)}}
