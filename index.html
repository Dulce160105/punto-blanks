function qty(k,d){const l=S.cart[k];l.qty=r3(l.qty+d);if(l.qty<=0)S.cart.splice(k,1);else{const e=stockErr(S.cart);if(e){l.qty=r3(l.qty-d);return msg(e)}}persist();drawCart()}
function drawCart(){const t=tot();$('#cartL').innerHTML=S.cart.map((l,k)=>`<div style="display:flex;justify-content:space-between;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)"><span>${esc(l.name)}</span><span style="white-space:nowrap"><button class="b s" onclick="qty(${k},-1)">−</button> ${l.qty} <button class="b s" onclick="qty(${k},1)">+</button> <b>${Q(l.price*l.qty)}</b> <button class="b s" onclick="editLine(${k})">✎</button> <button class="b s er" onclick="delLine(${k})">×</button></span></div>`).join('')||'<span class="mu">Carrito vacío</span>';
$('#tot').innerHTML=`<div class="mu">Subtotal ${Q(t.sub)} · Desc. −${Q(t.ds)} · Base ${Q(t.net)} · IVA ${tk().ivm==='add'?'(se suma)':'(incluido)'} ${Q(t.iva)}</div><div class="t">TOTAL ${Q(t.total)}</div>`;drawTks()}
function mkSale(o){const ts=new Date().toISOString(),days=o.c&&Number.isFinite(o.c.days)?Math.max(0,o.c.days):30,s={id:nid(),no:'F-'+String(++S.seqF).padStart(5,'0'),date:today(),ts,cli:o.c?o.c.id:0,name:o.name,nit:o.nit,dir:o.dir||'',tel:o.tel||'',mail:o.mail||'',vence:o.vence||'',items:o.items.map(i=>({...i})),sub:o.sub,ds:o.ds,iva:o.iva,total:o.total,paid:o.paid,pay:o.pay,due:o.vence||addD(today(),o.c?days:0),status:'EMITIDA'};
S.sales.push(s);s.items.forEach(i=>consume(i,s.no));if(o.paid>0)S.pays.push({id:nid(),ts,date:s.date,type:'cobro',ref:s.id,amt:o.paid,method:o.method});log('Venta '+s.no+' '+Q(s.total)+' ('+o.pay+')');return s}
function cobrar(){const t=tot();if(!S.cart.length)return msg('Carrito vacío');if(!S.caja){msg('Abra la caja primero');return go('caja')}
const ci=custInfo();if(ci.err)return msg(ci.err);const pay=tk().pay;let c=ci.c;if(pay==='credito'&&(ci.nit==='CF'||ci.name==='CONSUMIDOR FINAL'))return msg('El crédito requiere nombre y NIT del cliente');
const se=stockErr(S.cart);if(se)return msg(se);let paid=t.total;
if(pay==='credito'){paid=Math.min(t.total,Math.max(0,r2(nn(tk().rec)||0)));const owe=r2((c?cliSaldo(c.id):0)+t.total-paid);if(c&&c.limit&&owe>c.limit)return msg('Excede límite de crédito '+Q(c.limit)+' (quedaría '+Q(owe)+')')}
const run=()=>{if(pay==='credito')c=ensureCli(ci);const s=mkSale({c,name:ci.name,nit:ci.nit,dir:ci.dir,tel:ci.tel,mail:ci.mail,vence:tk().due||'',items:S.cart,sub:t.sub,ds:t.ds,iva:t.iva,total:t.total,paid,pay,method:pay==='credito'?'efectivo':pay});resetTk();persist();render();msg('Venta '+s.no+' registrada: '+Q(s.total))};
if(t.net<sum(S.cart,i=>i.cost*i.qty))ask('Venta por debajo del costo',[],()=>{run()},'Continuar de todos modos');else run()}
function cotizar(){if(!S.cart.length)return msg('Carrito vacío');const ci=custInfo();if(ci.err)return msg(ci.err);const t=tot();S.quotes.push({id:nid(),no:'C-'+String(++S.seqC).padStart(4,'0'),date:today(),exp:tk().due||addD(today(),30),cli:ci.c?ci.c.id:0,name:ci.name,nit:ci.nit,dir:ci.dir,tel:ci.tel,mail:ci.mail,items:S.cart.map(i=>({...i})),sub:t.sub,ds:t.ds,iva:t.iva,total:t.total,status:'VIGENTE'});resetTk();log('Cotización emitida');persist();render();msg('Cotización guardada en Cotizaciones')}
T.cot=()=>`<div class="c">${tbl(['No.','Fecha','Vence','Cliente','#Total','Estado',''],S.quotes.slice().reverse().map(q=>{const ex=q.status==='VIGENTE'&&daysTo(q.exp)<0;return[q.no,q.date,q.exp,esc(q.name),Q(q.total),`<span class="tag ${ex?'er':''}">${ex?'VENCIDA':q.status}</span>`,q.status==='VIGENTE'?`<button class="b s ok" onclick="qPay(${q.id},0)">ABONAR / A CxC</button> <button class="b s pr" onclick="qPay(${q.id},1)">CANCELAR TOTAL</button> <button class="b s" onclick="convQ(${q.id})">AL CARRITO</button> <button class="b s" onclick="printQ(${q.id})">🖨</button> <button class="b s er" onclick="discQ(${q.id})">ELIMINAR</button>`:`<button class="b s er" onclick="discQ(${q.id})">ELIMINAR</button>`]}))}</div>`;
function qPay(id,full){const q=S.quotes.find(x=>x.id===id);if(!S.caja){msg('Abra caja para cobrar');return go('caja')}const se=stockErr(q.items);if(se)return msg(se);
ask(full?'Cancelar cuenta total '+Q(q.total):'Abono inicial · el saldo pasa a Por cobrar',(full?[]:[{k:'a',l:'Monto del abono (0 = solo crédito)',t:'number',v:0}]).concat([{k:'m',l:'Método de pago',o:PAY}]),v=>{
const a=full?q.total:r2(nn(v.a)||0);if(a<0||a>q.total)return'Monto inválido (máx '+Q(q.total)+')';const nit=q.nit||'CF';let c=S.cli.find(x=>x.id===q.cli);const done=full||a>=q.total;
if(!done){if(q.name==='CONSUMIDOR FINAL'||nit==='CF')return'Para pasar a Por cobrar la cotización necesita nombre y NIT';const owe=r2((c?cliSaldo(c.id):0)+q.total-a);if(c&&c.limit&&owe>c.limit)return'Excede límite de crédito '+Q(c.limit);c=ensureCli({c,name:q.name,nit})}
const s=mkSale({c,name:q.name,nit,dir:q.dir,tel:q.tel,mail:q.mail,items:q.items,sub:q.sub??q.total,ds:q.ds||0,iva:q.iva??r2(q.total-q.total/(1+S.cfg.iva/100)),total:q.total,paid:a,pay:done?v.m:'credito',method:v.m});q.status='CONVERTIDA';q.sale=s.no;persist();render();msg(done?'Cuenta cancelada: '+s.no+' en Historial de ventas':'Abono '+Q(a)+' · saldo '+Q(sal(s))+' pasó a Por cobrar')},full?'Cobrar total':'Registrar')}
function convQ(id){const q=S.quotes.find(x=>x.id===id);if(!q)return msg('No se encontró la cotización');if(daysTo(q.exp)<0)msg('Cotización vencida: se recomienda revalidar precios');const missing=q.items.find(i=>i.sku&&!findItem(i.sku));if(missing)return msg('El producto '+missing.sku+' ya no existe en inventario o catálogo');if(S.cart.length)newTk();S.cart=q.items.map(i=>{const p=findItem(i.sku)||i;return{...i,price:p.price??i.price,cost:p.cost??i.cost}});q.status='CONVERTIDA';log('Cotización '+q.no+' → carrito');persist();go('pos');msg('Cargada al carrito con precios y costos vigentes') }
function discQ(id){ask('¿Eliminar esta cotización?',[],()=>{S.quotes=S.quotes.filter(x=>x.id!==id);log('Cotización eliminada');persist();render()},'Eliminar')}
T.hist=()=>`<div class="c">${tbl(['Factura','Fecha','Cliente','#Total','#Cobrado','#Saldo','Estado',''],S.sales.slice().reverse().slice(0,80).map(s=>{const e=stl(s);return[s.no,s.date,esc(s.name),Q(s.total),Q(s.paid),Q(sal(s)),`<span class="tag ${e==='ANULADA'?'er':e==='CANCELADA'?'ok':'wa'}">${e}</span>`,`<button class="b s" onclick="printSale(${s.id},0)">TICKET</button> <button class="b s" onclick="printSale(${s.id},1)">FACTURA</button> ${e==='ANULADA'?`<button class="b s er" onclick="delSale(${s.id})">ELIMINAR</button>`:`<button class="b s er" onclick="anular(${s.id})">ANULAR</button>`+(e==='CANCELADA'?` <button class="b s er" onclick="delSale(${s.id})">ELIMINAR</button>`:'')}`]}))}<p class="mu">Una venta cancelada (pagada) puede eliminarse de esta lista: se archiva y sigue contando en contabilidad (${(S.arch||[]).length} archivadas). Una venta anulada se elimina por completo. Anular exige motivo, repone stock y reversa cobros; una factura FEL anulada también debe anularse ante el certificador/SAT.</p></div>`;
function anular(id){ask('Anular venta',[{k:'m',l:'Motivo (obligatorio)'}],v=>{if(!v.m.trim())return'Indique el motivo';const s=S.sales.find(x=>x.id===id),ts=new Date().toISOString();s.items.forEach(i=>restore(i,s.no));S.pays.filter(p=>p.ref===id&&p.type==='cobro'&&p.amt>0).forEach(p=>S.pays.push({id:nid(),ts,date:today(),type:'cobro',ref:id,amt:-p.amt,method:p.method}));s.status='ANULADA';s.motivo=v.m;log('ANULADA '+s.no+': '+v.m);persist();render()},'Anular')}
T.inv=()=>`<div class="c"><div class="f"><div><label>SKU</label><input id="i_sku"></div><div><label>Descripción</label><input id="i_desc"></div><div><label>Categoría</label><input id="i_cat"></div><div><label>Costo neto (sin IVA)</label><input id="i_cost" type="number" step="any"></div><div><label>Precio c/IVA</label><input id="i_price" type="number" step="any"></div><div><label>Stock</label><input id="i_stock" type="number" step="any"></div><div><label>Mínimo</label><input id="i_min" type="number" step="any"></div><div><label><input type="checkbox" id="i_svc" style="width:auto"> Servicio</label></div><button class="b pr" onclick="saveInv()">GUARDAR</button></div></div>
<div class="c"><b>Valor del inventario al costo: ${Q(kpi().invV)}</b>${tbl(['SKU','Descripción','Cat.','#Costo','#Precio','#Margen','#Stock','#Valor',''],S.inv.map(i=>{const bn=i.price/(1+S.cfg.iva/100),m=bn?(bn-i.cost)/bn*100:0;return[esc(i.sku),esc(i.desc)+(i.rec?' 🧪':''),esc(i.cat),Q(i.cost),Q(i.price),`<span class="${m<15?'er':'ok'}">${m.toFixed(1)}%</span>`,i.svc?'—':`<span class="${i.stock<=i.min?'er':''}">${i.stock}</span>`,i.svc?'—':Q(i.cost*i.stock),`<button class="b s" onclick="editInv('${ek(i.sku)}')">EDITAR</button> ${i.svc?'':`<button class="b s" onclick="adjInv('${ek(i.sku)}')">AJUSTE</button>`} ${i.rec?`<button class="b s pr" onclick="fabricar('${ek(i.sku)}')">FABRICAR</button> <button class="b s" onclick="loadRec('${ek(i.sku)}')">RECETA</button> `:''}<button class="b s er" onclick="delInv('${ek(i.sku)}')">X</button>`]}))}</div>
<div class="c"><b>Kardex (últimos movimientos)</b>${tbl(['Fecha','SKU','#Cant.','Ref.','#Saldo'],S.kardex.slice(-15).reverse().map(k=>[localStamp(k.ts),esc(k.sku),k.q,esc(k.ref),k.saldo]))}</div>`;
function saveInv(){const g=k=>cl($('#i_'+k).value,60),sku=g('sku').toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!sku||!g('desc'))return msg('SKU y descripción son obligatorios');const cost=nn(g('cost')||'0'),price=nn(g('price')),stockIn=nn(g('stock')||'0'),min=nn(g('min')||'0');if(!Number.isFinite(cost)||cost<0)return msg('Costo inválido');if(!(price>0))return msg('Precio inválido');if(!Number.isFinite(stockIn)||stockIn<0||!Number.isFinite(min)||min<0)return msg('Stock y mínimo deben ser cantidades válidas y no negativas');if(S.cat.some(c=>c.sku===sku))return msg('Ese SKU ya existe en el Catálogo');const old=S.inv.find(i=>i.sku===sku),svc=$('#i_svc').checked?1:0;if(old&&svc&&old.stock>0)return msg('Ajuste las existencias a 0 antes de marcar el producto como servicio');if(old&&!!old.svc!==!!svc&&S.sales.some(s=>s.status!=='ANULADA'&&s.items.some(i=>i.sku===sku)))return msg('No se puede cambiar el tipo mientras haya ventas que todavía puedan anularse');const stock=svc?0:r3(stockIn);
const it={sku,desc:g('desc'),cat:(g('cat')||'GENERAL').toUpperCase(),cost:r2(cost),price:r2(price),stock:old?old.stock:stock,min:r3(min),svc};if(old){Object.assign(old,it);log('Editado '+sku)}else{S.inv.push(it);if(stock>0){S.kardex.push({ts:new Date().toISOString(),sku,q:stock,ref:'INV. INICIAL',saldo:stock})}log('Nuevo '+sku)}persist();render()}
function editInv(sku){const i=S.inv.find(x=>x.sku===sku);$('#i_sku').value=i.sku;$('#i_desc').value=i.desc;$('#i_cat').value=i.cat;$('#i_cost').value=i.cost;$('#i_price').value=i.price;$('#i_stock').value=i.stock;$('#i_min').value=i.min;$('#i_svc').checked=!!i.svc;scrollTo(0,0)}
function adjInv(sku){ask('Ajuste de inventario '+sku,[{k:'q',l:'Cantidad (+ entra / − sale)',t:'number'},{k:'m',l:'Motivo (merma, conteo físico…)'}],v=>{const q=nn(v.q),i=S.inv.find(x=>x.sku===sku);if(!Number.isFinite(q)||!q||!v.m.trim())return'Cantidad y motivo obligatorios';if(i&&r3(i.stock+q)<0)return'El ajuste dejaría existencias negativas';mov(sku,r3(q),'AJUSTE: '+v.m);log('Ajuste '+sku+' '+q+' '+v.m);persist();render()})}
function delInv(sku){const u=S.cat.filter(c=>c.rec.some(r=>r.sku===sku));if(u.length)return msg('Es insumo de la fórmula '+u.map(c=>c.sku).join(', ')+': edite la fórmula primero');if(S.sales.some(s=>s.status!=='ANULADA'&&s.items.some(i=>i.sku===sku)))return msg('No se puede eliminar mientras haya ventas que todavía puedan anularse');if(S.bills.some(b=>b.sku===sku&&billBal(b)>0))return msg('Tiene una compra pendiente por pagar; conserve el producto hasta liquidarla');conf('¿Eliminar el producto '+sku+' del inventario? Las ventas pasadas conservan su registro.',()=>{S.inv=S.inv.filter(i=>i.sku!==sku);log('Inventario eliminado '+sku);persist();render()})}
T.cli=()=>`<div class="c"><div class="f"><div><label>Nombre</label><input id="c_n"></div><div><label>NIT</label><input id="c_nit"></div><div><label>Límite crédito Q</label><input id="c_l" type="number" step="any"></div><div><label>Días crédito</label><input id="c_d" type="number" value="30"></div><div><label>Dirección</label><input id="c_dir"></div><div><label>Teléfono</label><input id="c_tel"></div><div><label>Correo</label><input id="c_mail"></div><button class="b pr" onclick="saveCli()">AGREGAR</button></div></div><div class="c">${tbl(['Cliente','NIT','#Límite','#Saldo','#Disponible',''],S.cli.map(c=>{const s=cliSaldo(c.id);return[esc(c.name),esc(c.nit),Q(c.limit),Q(s),c.limit?Q(c.limit-s):'—',`<button class="b s er" onclick="delCli(${c.id})">ELIMINAR</button>`]}))}</div>`;
function saveCli(){const n=cl($('#c_n').value).toUpperCase(),nit=cl($('#c_nit').value,20).toUpperCase(),limit=nn($('#c_l').value||'0'),daysRaw=$('#c_d').value.trim(),days=daysRaw?ni(daysRaw):30,mail=cl($('#c_mail').value,80);if(!n||!nitOk(nit)||nit==='CF')return msg('Nombre y NIT válido son obligatorios (verifica dígito)');if(S.cli.some(c=>c.nit===nit))return msg('NIT ya registrado');if(!Number.isFinite(limit)||limit<0||!Number.isFinite(days)||days<0)return msg('Límite y días de crédito deben ser cantidades válidas y no negativas');if(mail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return msg('Correo del cliente inválido');S.cli.push({id:nid(),name:n,nit,limit,days,dir:cl($('#c_dir').value,100),tel:cl($('#c_tel').value,30),mail});persist();render()}
T.cxc=()=>{const o=live().filter(s=>sal(s)>0);return agingHtml(aging(o.map(s=>[s.due,sal(s)])))+`<div class="c">${tbl(['Factura','Cliente','Vence','#Días mora','#Saldo',''],o.map(s=>[s.no,esc(s.name),s.due,Math.max(0,-daysTo(s.due)),Q(sal(s)),`<button class="b s ok" onclick="cobro(${s.id})">COBRAR</button>`]))}</div>`};
function cobro(id){const s=S.sales.find(x=>x.id===id);if(!S.caja)return msg('Abra caja para registrar cobros');ask('Cobro '+s.no+' · saldo '+Q(sal(s)),[{k:'a',l:'Monto',t:'number',v:sal(s)},{k:'m',l:'Método',o:PAY}],v=>{const a=r2(nn(v.a));if(!(a>0)||a>sal(s))return'Monto inválido (máx '+Q(sal(s))+')';s.paid=r2(s.paid+a);S.pays.push({id:nid(),ts:new Date().toISOString(),date:today(),type:'cobro',ref:id,amt:a,method:v.m});log('Cobro '+s.no+' '+Q(a));persist();render()},'Registrar cobro')}
T.cxp=()=>{const o=S.bills.filter(b=>billBal(b)>0),pv=id=>(S.prov.find(p=>p.id===id)||{}).name;return`<div class="c"><div class="f"><div><label>Proveedor</label><select id="b_p">${S.prov.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="b" onclick="addProv()">+ Proveedor</button><div><label>Concepto</label><input id="b_d"></div><div><label>Total factura c/IVA</label><input id="b_t" type="number" step="any"></div><div><label>Días crédito</label><input id="b_dc" type="number" value="30"></div><div><label>Ingresa a inventario (SKU)</label><select id="b_s"><option value="">— ninguno —</option>${S.inv.filter(i=>!i.svc).map(i=>`<option>${esc(i.sku)}</option>`).join('')}</select></div><div><label>Cantidad</label><input id="b_q" type="number" step="any"></div><button class="b pr" onclick="addBill()">REGISTRAR COMPRA</button></div></div>`+agingHtml(aging(o.map(b=>[b.due,billBal(b)])))+`<div class="c">${tbl(['Fecha','Proveedor','Concepto','Vence','#Total','#Saldo',''],o.map(b=>[b.date,esc(pv(b.prov)),esc(b.desc),b.due,Q(b.total),Q(billBal(b)),`<button class="b s ok" onclick="payBill(${b.id})">PAGAR</button> <button class="b s er" onclick="delBill(${b.id})">ELIMINAR</button>`]))}</div><div class="c"><b>Proveedores</b>${tbl(['Proveedor','NIT','#Saldo',''],S.prov.map(p=>[esc(p.name),esc(p.nit),Q(sum(S.bills.filter(b=>b.prov===p.id),billBal)),`<button class="b s er" onclick="delProv(${p.id})">ELIMINAR</button>`]))}</div>`};
function addProv(){ask('Nuevo proveedor',[{k:'n',l:'Nombre'},{k:'t',l:'NIT'}],v=>{if(!v.n.trim()||!nitOk(v.t))return'Nombre y NIT válido requeridos';S.prov.push({id:nid(),name:v.n.toUpperCase(),nit:v.t.toUpperCase()});persist();render()})}
function addBill(){const t=r2(nn($('#b_t').value)),sku=$('#b_s').value,q=r3(nn($('#b_q').value)||0),dcRaw=$('#b_dc').value.trim(),dc=dcRaw?ni(dcRaw):30;if(!S.prov.length)return msg('Agregue un proveedor');if(!(t>0))return msg('Total inválido');if(sku&&q<=0)return msg('Indique cantidad');if(!Number.isFinite(dc)||dc<0)return msg('Los días de crédito deben ser un número no negativo');
const iva=r2(t-t/(1+S.cfg.iva/100)),b={id:nid(),date:today(),prov:+$('#b_p').value,desc:cl($('#b_d').value)||'Compra',total:t,iva,paid:0,due:addD(today(),dc)};S.bills.push(b);

function setUserStorage(userId,owner){const next=KEY+':'+userId,legacyOwner=localStorage.getItem('pb_legacy_owner');if(!localStorage.getItem(next)&&owner&&(!legacyOwner||legacyOwner===userId)&&localStorage.getItem(KEY)){localStorage.setItem(next,localStorage.getItem(KEY));if(localStorage.getItem(LEGACY_LTS))localStorage.setItem('pb_ts:'+userId,localStorage.getItem(LEGACY_LTS));if(localStorage.getItem(LEGACY_DRT))localStorage.setItem('pb_dirty:'+userId,localStorage.getItem(LEGACY_DRT));localStorage.setItem('pb_legacy_owner',userId);localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_LTS);localStorage.removeItem(LEGACY_DRT)}else if(!owner||(legacyOwner&&legacyOwner!==userId)){localStorage.removeItem(KEY);localStorage.removeItem(LEGACY_LTS);localStorage.removeItem(LEGACY_DRT)}ACTIVE_KEY=next;LTS='pb_ts:'+userId;DRT='pb_dirty:'+userId;RESTORING=true;try{load()}finally{RESTORING=false}}
function cloudPersist(){if(!cloudOn||!USER||RESTORING)return;REV++;try{localStorage.setItem(DRT,'1')}catch(e){}setSync('save');clearTimeout(pt);pt=setTimeout(pushNow,1500)}
function stateTable(){return TEAM_MODE?'workspace_state':'app_state'}
function stateColumn(){return TEAM_MODE?'workspace_id':'user_id'}
function stateId(){return TEAM_MODE?WORKSPACE_ID:USER.id}
const cloudRow=()=>SB.from(stateTable()).select('data,updated_at').eq(stateColumn(),stateId()).maybeSingle();
function askConflict(d){if(conflictOpen||!d)return;conflictOpen=true;ask('Este dispositivo y la nube tienen cambios distintos. ¿Usar los de la nube? (Cancelar = conservar este dispositivo)',[],()=>{conflictOpen=false;adopt(d)},'Usar la nube');$('#dno').onclick=()=>{$('#dlg').classList.remove('show');conflictOpen=false;localStorage.setItem(LTS,d.updated_at);pushNow()}}
function cloudSnapshot(){const data=JSON.parse(JSON.stringify(S));if(TEAM_MODE&&data.adm){delete data.adm.hash;delete data.adm.salt}return data}
async function pushNow(){if(!cloudOn||!USER)return;clearTimeout(pt);if(pushPromise)return pushPromise;pushPromise=(async()=>{while(cloudOn&&USER){const r=REV,snapshot=cloudSnapshot();try{const lts=localStorage.getItem(LTS);let data,error;const table=SB.from(stateTable()),key=stateColumn(),id=stateId();if(lts){({data,error}=await table.update({data:snapshot}).eq(key,id).eq('updated_at',lts).select('updated_at').maybeSingle());if(error)throw error;if(!data){const cur=await cloudRow();if(cur.error)throw cur.error;if(cur.data){askConflict(cur.data);return}localStorage.removeItem(LTS);continue}}else{const record={data:snapshot};record[key]=id;({data,error}=await SB.from(stateTable()).insert(record).select('updated_at').maybeSingle());if(error){if(error.code==='23505'){const cur=await cloudRow();if(cur.error)throw cur.error;if(cur.data){askConflict(cur.data);return}}throw error}if(!data)throw new Error('No se confirmó el guardado en la nube')}localStorage.setItem(LTS,data.updated_at);if(r===REV){localStorage.removeItem(DRT);setSync('ok');return}}catch(e){setSync('err');return}}})().finally(()=>{pushPromise=null});return pushPromise}
function adopt(d){if(!d||!d.data||typeof d.data!=='object'||!Array.isArray(d.data.inv)||!Array.isArray(d.data.sales)||!Array.isArray(d.data.cli))throw new Error('Los datos de la nube no tienen el formato esperado');const local=scrub(JSON.parse(JSON.stringify(d.data)));if(TEAM_MODE&&local.adm){delete local.adm.hash;delete local.adm.salt;if(TEAM_ROLE==='owner'&&OWNER_SECURITY){local.adm.hash=OWNER_SECURITY.admin_hash;local.adm.salt=OWNER_SECURITY.admin_salt}}localStorage.setItem(ACTIVE_KEY,JSON.stringify(local));localStorage.setItem(LTS,d.updated_at);localStorage.removeItem(DRT);load();render();setSync('ok')}
async function pull(){try{const{data,error}=await cloudRow();if(error)throw error;const dirty=localStorage.getItem(DRT)==='1',lts=localStorage.getItem(LTS);if(!data){localStorage.removeItem(LTS);await pushNow();return}if(!lts){if(dirty){askConflict(data);return}adopt(data);return}if(data.updated_at===lts){if(dirty)await pushNow();else setSync('ok');return}if(!dirty){adopt(data);return}askConflict(data)}catch(e){setSync('err')}}
async function initializeWorkspace(){const{data,error}=await SB.functions.invoke('workspace-admin',{body:{action:'bootstrap'}});if(error||!data||!data.workspace)throw error||new Error('workspace unavailable');const w=data.workspace;if(!/^[0-9a-f-]{36}$/i.test(w.workspace_id)||!['owner','staff'].includes(w.role))throw new Error('invalid workspace');TEAM_MODE=true;WORKSPACE_ID=w.workspace_id;TEAM_ROLE=w.role;TEAM_USERNAME=cl(w.username,32)}
async function loadOwnerSecurity(){if(!TEAM_MODE||TEAM_ROLE!=='owner')return;const{data,error}=await SB.from('workspace_owner_security').select('admin_salt,admin_hash').eq('workspace_id',WORKSPACE_ID).maybeSingle();if(error)throw error;if(data){OWNER_SECURITY=data;S.adm.salt=data.admin_salt;S.adm.hash=data.admin_hash;localStorage.setItem(ACTIVE_KEY,JSON.stringify(S));return}if(S.adm.salt&&S.adm.hash)await saveOwnerSecurity()}
async function saveOwnerSecurity(){if(!TEAM_MODE||TEAM_ROLE!=='owner'||!S.adm.salt||!S.adm.hash)return;const security={workspace_id:WORKSPACE_ID,admin_salt:S.adm.salt,admin_hash:S.adm.hash};const{data,error}=await SB.from('workspace_owner_security').upsert(security,{onConflict:'workspace_id'}).select('admin_salt,admin_hash').single();if(error)throw error;OWNER_SECURITY=data}
function processRealtime(){if(pushPromise){rtTimer=setTimeout(processRealtime,500);return}pull()}
function subscribeWorkspace(){if(!TEAM_MODE||!USER)return;if(REALTIME)SB.removeChannel(REALTIME);REALTIME=SB.channel('workspace-'+WORKSPACE_ID).on('postgres_changes',{event:'UPDATE',schema:'public',table:'workspace_state',filter:'workspace_id=eq.'+WORKSPACE_ID},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(processRealtime,1700)}).subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setSync('err')})}
function showAuth(err,off){$('#auth').style.display='flex';$('#lo').style.display='none';$('#aerr').textContent=err||'';$('#aoff').style.display=off?'':'none'}
function offline(){$('#auth').style.display='none';cloudOn=false;setSync('local');render()}
async function start(){$('#auth').style.display='none';$('#lo').style.display='';setSync('save');TEAM_MODE=false;TEAM_ROLE='owner';WORKSPACE_ID=null;TEAM_USERNAME='';OWNER_SECURITY=null;try{await initializeWorkspace()}catch(e){setSync('err');USER=null;try{await SB.auth.signOut()}catch(x){}showAuth('No se pudo verificar el rol del equipo. Revise que el esquema y la función segura de Supabase estén instalados.',false);return}setUserStorage(USER.id,TEAM_ROLE==='owner');if(TEAM_MODE&&TEAM_ROLE==='owner'){try{await loadOwnerSecurity()}catch(e){setSync('err')}}await pull();render();subscribeWorkspace()}
async function login(){const em=cl($('#ae').value,120),pw=$('#ap').value;if(!em||!pw){$('#aerr').textContent='Escriba su correo y contraseña';return}try{const{data,error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error||!data||!data.user){$('#aerr').textContent='Correo o contraseña incorrectos';return}USER=data.user;$('#ap').value='';await start()}catch(e){$('#aerr').textContent='No se pudo conectar. Revise su internet.'}}
async function logout(){await pushNow();if(localStorage.getItem(DRT)==='1'){msg('Hay cambios sin sincronizar: no se cerró la sesión. Revise su conexión.');return}try{if(REALTIME)await SB.removeChannel(REALTIME);await SB.auth.signOut()}catch(e){}localStorage.removeItem(ACTIVE_KEY);localStorage.removeItem(LTS);localStorage.removeItem(DRT);REALTIME=null;USER=null;TEAM_MODE=false;WORKSPACE_ID=null;location.reload()}
function publicKey(k){if(/^sb_publishable_[A-Za-z0-9_-]+$/.test(k))return true;try{const p=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return p.role==='anon'}catch(e){return false}}
function validCloudConfig(){try{const u=new URL(CFG.url),key=typeof CFG.key==='string'?CFG.key.trim():'';return u.protocol==='https:'&&/^[a-z0-9-]+\.supabase\.co$/i.test(u.hostname)&&!u.username&&!u.password&&!u.search&&!u.hash&&publicKey(key)}catch(e){return false}}
function loadSupabase(){return new Promise((resolve,reject)=>{if(window.supabase&&window.supabase.createClient)return resolve();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0';s.async=true;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';s.onload=()=>window.supabase&&window.supabase.createClient?resolve():reject(new Error('SDK no disponible'));s.onerror=()=>reject(new Error('No se pudo descargar Supabase'));document.head.appendChild(s)})}
async function boot(){const configured=!!(CFG.url||CFG.key);if(!configured){setSync('local');render();return}if(!validCloudConfig()){setSync('err');showAuth('La configuración de Supabase está incompleta o no es válida.',true);return}cloudOn=true;try{await loadSupabase();SB=window.supabase.createClient(CFG.url,CFG.key);SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&USER){if(REALTIME)SB.removeChannel(REALTIME);REALTIME=null;USER=null;TEAM_MODE=false;WORKSPACE_ID=null;showAuth('Su sesión terminó. Inicie sesión de nuevo.')}});const{data}=await SB.auth.getSession();if(data&&data.session){USER=data.session.user;await start()}else showAuth()}catch(e){setSync('err');showAuth('No se pudo cargar o conectar con Supabase. Revise su conexión.',true)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER)pull()});
load();boot();

</script></body></html>
