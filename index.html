function tbl(h,rows,size){size=size??8;const k=hk(h),n=size?Math.max(1,Math.ceil(rows.length/size)):1,p=Math.min(PG[k]||0,n-1);PG[k]=p;const v=size?rows.slice(p*size,p*size+size):rows;

const month=()=>today().slice(0,7);
function kpi(){const m=month(),vs=live().filter(s=>s.date.startsWith(m)),ex=S.exp.filter(e=>e.date.startsWith(m)),bl=S.bills.filter(b=>b.date.startsWith(m));
const net=sum(vs,s=>s.total-s.iva),cogs=sum(vs,s=>sum(s.items,i=>i.cost*i.qty)),gm=S.gem.filter(g=>!g.link&&g.date.startsWith(m)),exn=r2(sum(ex,e=>e.amt-e.iva)+sum(gm,gmNet)),ivaD=sum(vs,s=>s.iva),ivaC=r2(sum(ex,e=>e.iva)+sum(gm,g=>g.iva)+sum(bl,b=>b.iva));
const cxc=sum(live(),sal),cxcV=sum(live().filter(s=>sal(s)>0&&daysTo(s.due)<0),sal),cxp=sum(S.bills,billBal),cxpV=sum(S.bills.filter(b=>billBal(b)>0&&daysTo(b.due)<0),billBal);
return{net,cogs,gp:r2(net-cogs),mg:net?(net-cogs)/net*100:0,exn,op:r2(net-cogs-exn),ivaD,ivaC,ivaP:r2(ivaD-ivaC),cxc,cxcV,cxp,cxpV,invV:r2(sum(S.inv.filter(i=>!i.svc),i=>i.cost*i.stock)+sum(S.cat,c=>c.cost*(c.stock||0))),low:S.inv.filter(i=>!i.svc&&i.stock<=i.min),vs}}

function closeTk(i){if(S.tks.length<2)return msg('Debe quedar al menos un ticket');const run=()=>{persist();const act=i===S.at;S.tks.splice(i,1);if(i<S.at)S.at--;else if(act)S.at=Math.min(i,S.tks.length-1);S.cart=tk().cart;S.cust=tk().cust;persist();render()};if(S.tks[i].cart.length)ask('Cerrar venta con productos agregados',[],()=>{run()},'Cerrar y descartar');else run()}
function tkTot(t){const sub=sum(t.cart,i=>i.price*i.qty),d=(t.dsc||'0').trim();let ds=d.endsWith('%')?sub*(nn(d)||0)/100:nn(d)||0;ds=r2(Math.max(0,Math.min(sub,ds)));const base=r2(sub-ds),v=(t.ivi||'').trim(),pc=v.endsWith('%'),n=Math.max(0,nn(v)||0);let iva,total;
if(t.ivm==='add'){iva=r2(pc?base*n/100:n);total=r2(base+iva)}else{total=base;iva=r2(pc?base-base/(1+n/100):Math.min(n,base))}return{sub,ds,total,iva,net:r2(total-iva)}}

const cw1=ch=>{const b=ch.normalize('NFD').charCodeAt(0);return b>=32&&b<=126?HW[b-32]:556},pesc=s=>s.replace(/[\\()]/g,'\\$&');
class PDF{constructor(w,h){this.w=w;this.h=h;this.pages=[[]];this.ops=this.pages[0];this.imgs=[]}
np(){this.ops=[];this.pages.push(this.ops)}
tw(s,sz,b){let t=0;for(const ch of nrm(s))t+=cw1(ch);return t*sz/1000*(b?1.07:1)}
text(x,y,s,sz,o={}){s=nrm(s);if(!s)return;const w=this.tw(s,sz,o.b);if(o.al==='r')x-=w;else if(o.al==='c')x-=w/2;const c=o.c||[0,0,0];this.ops.push(`BT /${o.b?'F2':'F1'} ${sz} Tf ${c.join(' ')} rg ${x.toFixed(2)} ${(this.h-y).toFixed(2)} Td (${pesc(s)}) Tj ET`)}
line(x1,y1,x2,y2,wd,c){this.ops.push(`${(c||[.7,.7,.7]).join(' ')} RG ${wd||.5} w ${x1.toFixed(2)} ${(this.h-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.h-y2).toFixed(2)} l S`)}
rect(x,y,w,h,f){this.ops.push(`${f.join(' ')} rg ${x.toFixed(2)} ${(this.h-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`)}
img(i,x,y,w,h){this.ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(this.h-y-h).toFixed(2)} cm /Im${i+1} Do Q`)}
wrap(s,w,sz,b){const out=[];for(const para of nrm(s).split('\n')){let cur='';for(const word of para.split(' ')){const t=cur?cur+' '+word:word;if(this.tw(t,sz,b)<=w||!cur)cur=t;else{out.push(cur);cur=word}}out.push(cur)}return out}
fit(s,w,sz,b){s=nrm(s);if(this.tw(s,sz,b)<=w)return s;while(s.length>1&&this.tw(s+'..',sz,b)>w)s=s.slice(0,-1);return s+'..'}
build(title){const parts=[],offs=[];let len=0;const B=s=>{const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;return u},add=x=>{const u=typeof x==='string'?B(x):x;parts.push(u);len+=u.length};
const n=this.pages.length,ni=this.imgs.length,base=5+ni;add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');const obj=(i,body)=>{offs[i]=len;add(i+' 0 obj\n'+body+'\nendobj\n')};
obj(1,'<< /Type /Catalog /Pages 2 0 R >>');const kids=[];for(let p=0;p<n;p++)kids.push((base+2*p)+' 0 R');obj(2,`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`);
obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
this.imgs.forEach((im,i)=>{const id=5+i;offs[id]=len;add(`${id} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);add(im.bytes);add('\nendstream\nendobj\n')});
const xo=this.imgs.map((_,i)=>`/Im${i+1} ${5+i} 0 R`).join(' ');
for(let p=0;p<n;p++){const pid=base+2*p,cid=pid+1,cs=B(this.pages[p].join('\n'));obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.w.toFixed(2)} ${this.h.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xo} >> >> /Contents ${cid} 0 R >>`);offs[cid]=len;add(`${cid} 0 obj\n<< /Length ${cs.length} >>\nstream\n`);add(cs);add('\nendstream\nendobj\n')}

function delCli(id){const c=S.cli.find(x=>x.id===id);if(cliSaldo(id)>0)return msg('Tiene saldo pendiente: cóbrelo antes de eliminar');conf('¿Eliminar al cliente '+c.name+'? Sus ventas conservan el nombre.',()=>{S.cli=S.cli.filter(x=>x.id!==id);log('Cliente eliminado '+c.name);persist();render()})}
function delProv(id){const p=S.prov.find(x=>x.id===id);if(S.bills.some(b=>b.prov===id&&billBal(b)>0))return msg('Tiene compras por pagar');conf('¿Eliminar al proveedor '+p.name+'?',()=>{S.prov=S.prov.filter(x=>x.id!==id);log('Proveedor eliminado '+p.name);persist();render()})}
function delBill(id){const b=S.bills.find(x=>x.id===id);if(b.paid>0)return msg('Tiene pagos registrados: no se elimina');const it=b.sku&&S.inv.find(x=>x.sku===b.sku);if(it&&!it.svc&&it.stock<b.qty)return msg('No hay stock suficiente para revertir la entrada de '+b.sku+'; ajuste el inventario primero');
conf('¿Eliminar esta compra'+(b.sku?' y revertir su entrada de inventario':'')+'?',()=>{if(it){const u=(b.total-b.iva)/b.qty;if(it.stock>b.qty)it.cost=r2((it.cost*it.stock-u*b.qty)/(it.stock-b.qty));mov(b.sku,-b.qty,'ELIMINA COMPRA')}S.bills=S.bills.filter(x=>x.id!==id);log('Compra eliminada '+Q(b.total));persist();render()})}
function delExp(id){const e=S.exp.find(x=>x.id===id);conf('¿Eliminar este gasto de '+Q(e.amt)+'?'+(e.method==='efectivo'?' El efectivo vuelve a la caja.':''),()=>{S.gem.forEach(g=>{if(g.link===id)delete g.link});S.exp=S.exp.filter(x=>x.id!==id);log('Gasto del día eliminado '+Q(e.amt));persist();render()})}
function delSale(id){const s=S.sales.find(x=>x.id===id);if(!s)return;const e=stl(s);if(e!=='ANULADA'&&e!=='CANCELADA')return msg('Solo se eliminan ventas canceladas (pagadas) o anuladas');conf(e==='ANULADA'?'¿Eliminar la venta anulada '+s.no+'?':'¿Eliminar de la lista la venta cancelada '+s.no+'? Se archiva: sus montos siguen contando en contabilidad y reportes.',()=>{S.sales=S.sales.filter(x=>x.id!==id);if(e==='ANULADA'){S.pays=S.pays.filter(p=>!(p.type==='cobro'&&p.ref===id));log('Venta anulada eliminada '+s.no)}else{S.arch=S.arch||[];S.arch.push(s);log('Venta cancelada archivada '+s.no)}persist();render()})}
function delCierre(i){conf('¿Eliminar este cierre de caja del historial?',()=>{S.cierres.splice(i,1);log('Cierre eliminado');persist();render()})}
const TABS=[['dash','📊 Panel'],['pos','🛒 Ventas'],['hist','🧾 Historial'],['cot','📝 Cotizaciones'],['inv','📦 Inventario'],['cat','📚 Catálogo'],['cli','👥 Clientes'],['cxc','💰 Por cobrar'],['cxp','🏭 Compras / Por pagar'],['gas','💸 Gastos del día'],['gem','🏢 Gastos de la empresa'],['caja','🏧 Caja'],['rep','📑 Impuestos y reportes'],['adm','⚙ Administración']];
function go(t){if(t==='adm'&&!ADM_OK&&hasKey()){askKey('Administración',()=>{ADM_OK=true;tab='adm';render()});return}if(t!=='adm')ADM_OK=false;tab=t;render()}
function render(){if(tab!=='adm')ADM_OK=false;$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#cajaSt').innerHTML=S.caja?'<span class="tag ok">CAJA ABIERTA</span>':'<span class="tag er">CAJA CERRADA</span>';$('#main').innerHTML=T[tab]();if(tab==='pos'){drawProds();drawCart()}}
// ===== Nube (Supabase) =====
const CFG=window.PB_CONFIG||{},LTS='pb_ts',DRT='pb_dirty';let SB=null,USER=null,pt=null,REV=0,cloudOn=false;
function setSync(k){const e=$('#syncSt');if(!e)return;const m={ok:['☁ Sincronizado',''],save:['☁ Guardando…','wa'],err:['⚠ Sin conexión: guardado local','er'],local:['Modo local','']}[k];e.textContent=m[0];e.className='tag '+m[1]}
function cloudPersist(){if(!cloudOn||!USER)return;REV++;try{localStorage.setItem(DRT,'1')}catch(e){}setSync('save');clearTimeout(pt);pt=setTimeout(pushNow,1500)}
async function pushNow(){if(!cloudOn||!USER)return;clearTimeout(pt);const r=REV;try{const{data,error}=await SB.from('app_state').upsert({user_id:USER.id,data:S},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;localStorage.setItem(LTS,data.updated_at);if(r===REV){localStorage.removeItem(DRT);setSync('ok')}}catch(e){setSync('err')}}
function adopt(d){localStorage.setItem(KEY,JSON.stringify(d.data));localStorage.setItem(LTS,d.updated_at);localStorage.removeItem(DRT);load();render();setSync('ok')}
async function pull(){try{const{data,error}=await SB.from('app_state').select('data,updated_at').eq('user_id',USER.id).maybeSingle();if(error)throw error;
const dirty=localStorage.getItem(DRT)==='1',lts=localStorage.getItem(LTS);
if(!data){await pushNow();return}
if(!lts){adopt(data);return}
if(data.updated_at===lts){if(dirty)await pushNow();else setSync('ok');return}
if(!dirty){adopt(data);return}
ask('Este dispositivo y la nube tienen cambios distintos. ¿Usar los de la nube? (Cancelar = conservar los de este dispositivo y sobrescribir la nube)',[],()=>{adopt(data)},'Usar la nube');$('#dno').onclick=()=>{$('#dlg').classList.remove('show');pushNow()}}catch(e){setSync('err')}}
function showAuth(err,off){$('#auth').style.display='flex';$('#lo').style.display='none';$('#aerr').textContent=err||'';$('#aoff').style.display=off?'':'none'}
function offline(){$('#auth').style.display='none';cloudOn=false;setSync('local');render()}
async function start(){$('#auth').style.display='none';$('#lo').style.display='';setSync('save');await pull();render()}
async function login(){const em=cl($('#ae').value,120),pw=$('#ap').value;if(!em||!pw){$('#aerr').textContent='Escriba su correo y contraseña';return}
try{const{data,error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error||!data||!data.user){$('#aerr').textContent='Correo o contraseña incorrectos';return}USER=data.user;$('#ap').value='';await start()}catch(e){$('#aerr').textContent='No se pudo conectar. Revise su internet.'}}
async function logout(){await pushNow();if(localStorage.getItem(DRT)==='1'){msg('Hay cambios sin sincronizar: no se cerró la sesión. Revise su conexión.');return}try{await SB.auth.signOut()}catch(e){}localStorage.removeItem(KEY);localStorage.removeItem(LTS);USER=null;location.reload()}
async function boot(){cloudOn=!!(CFG.url&&CFG.key);if(!cloudOn){setSync('local');render();return}
if(!window.supabase){showAuth('No se pudo cargar Supabase. Revise su conexión.',true);return}
SB=window.supabase.createClient(CFG.url,CFG.key);SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&USER){USER=null;showAuth('Su sesión terminó. Inicie sesión de nuevo.')}});
try{const{data}=await SB.auth.getSession();if(data&&data.session){USER=data.session.user;await start()}else showAuth()}catch(e){showAuth('No se pudo conectar. Revise su internet.',true)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER)pull()});
load();boot();
</script></body></html>
