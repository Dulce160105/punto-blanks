function mkSale(o){const ts=new Date().toISOString(),s={id:nid(),no:'F-'+String(++S.seqF).padStart(5,'0'),date:today(),ts,cli:o.c?o.c.id:0,name:o.name,nit:o.nit,items:o.items.map(i=>({...i})),sub:o.sub,ds:o.ds,iva:o.iva,total:o.total,paid:o.paid,pay:o.pay,due:addD(today(),o.c?o.c.days||30:0),status:'EMITIDA'};

function cobrar(){const t=tot();if(!S.cart.length)return msg('Carrito vacío');if(!S.caja){msg('Abra la caja primero');return go('caja')}
const ci=custInfo();if(ci.err)return msg(ci.err);const pay=tk().pay;let c=ci.c;if(pay==='credito'&&(ci.nit==='CF'||ci.name==='CONSUMIDOR FINAL'))return msg('El crédito requiere nombre y NIT del cliente');

function qPay(id,full){const q=S.quotes.find(x=>x.id===id);if(!S.caja){msg('Abra caja para cobrar');return go('caja')}const se=stockErr(q.items);if(se)return msg(se);
ask(full?'Cancelar cuenta total '+Q(q.total):'Abono inicial · el saldo pasa a Por cobrar',(full?[]:[{k:'a',l:'Monto del abono (0 = solo crédito)',t:'number',v:0}]).concat([{k:'m',l:'Método de pago',o:PAY}]),v=>{
const a=full?q.total:r2(nn(v.a)||0);if(a<0||a>q.total)return'Monto inválido (máx '+Q(q.total)+')';const nit=q.nit||'CF';let c=S.cli.find(x=>x.id===q.cli);const done=full||a>=q.total;
if(!done){if(q.name==='CONSUMIDOR FINAL'||nit==='CF')return'Para pasar a Por cobrar la cotización necesita nombre y NIT';const owe=r2((c?cliSaldo(c.id):0)+q.total-a);if(c&&c.limit&&owe>c.limit)return'Excede límite de crédito '+Q(c.limit);c=ensureCli({c,name:q.name,nit})}

function saveInv(){const g=k=>cl($('#i_'+k).value,60),sku=g('sku').toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!sku||!g('desc'))return msg('SKU y descripción son obligatorios');const cost=nn(g('cost'))||0,price=nn(g('price'))||0;if(price<=0)return msg('Precio inválido');const old=S.inv.find(i=>i.sku===sku),svc=$('#i_svc').checked?1:0,stock=svc?0:ni(g('stock'))||0;

function drawCL(){$('#cl').innerHTML=tbl(['Concepto','#Costo unit.','#Cant.','#Subtotal',''],CL.map((l,i)=>[esc(l.n),Q(l.c),`<input type="number" step="any" value="${l.q}" style="width:80px" oninput="CL[${i}].q=nn(this.value)||0;calcTot()">`,`<span id="ls${i}">${Q(l.c*l.q)}</span>`,`<button class="b s er" onclick="CL.splice(${i},1);drawCL()">×</button>`]),0);calcTot()}
function calcRes(){const o=ohCalc(),mat=sum(CL,l=>l.c*l.q),cost=r2(mat+o.oh),y=Math.max(CY,.0001),u=r2(cost/y),m=Math.min(99,Math.max(0,CM)),net=r2(u/(1-m/100)),v=String(CI).trim(),n=Math.max(0,nn(v)||0),iva=r2(v.endsWith('%')?net*n/100:n);return{o,mat,cost,u,net,iva,pr:r2(net+iva),gain:r2(net-u)}}
function calcTot(){CL.forEach((l,i)=>{const e=$('#ls'+i);if(e)e.textContent=Q(l.c*l.q)});const r=calcRes(),g=(a,b,c)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><b class="${c||''}">${b}</b></div>`;$('#ct').innerHTML=g('Insumos y extras del lote',Q(r.mat))+(OT>0?g('Tarifa de gastos por hora',Q(r.o.rate)+'/h')+g('Gastos fijos prorrateados ('+OT+' min)',Q(r.o.fa))+g('Gastos variables y otros prorrateados',Q(r.o.va)):'')+g('Costo total del lote',Q(r.cost))+g('Costo por unidad',Q(r.u),'wa')+g('Precio sin IVA ('+Math.min(99,Math.max(0,CM))+'% margen)',Q(r.net))+g('IVA',Q(r.iva))+g('Precio sugerido con IVA',Q(r.pr),'ok')+g('Utilidad por unidad',Q(r.gain));$('#kp').placeholder=r.pr}
function calcSave(){if(!CL.length)return msg('Agregue componentes primero');const sku=$('#ks').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),old=S.inv.find(i=>i.sku===sku),desc=cl($('#kd').value)||(old&&old.desc);if(!sku||!desc)return msg('SKU y descripción son obligatorios');if(old&&!old.rec)return msg('Ese SKU existe sin receta: use otro SKU');
const rec=CL.filter(l=>l.sku).map(l=>({sku:l.sku,n:l.n,q:l.q})),ex=CL.filter(l=>!l.sku).map(l=>({n:l.n,c:r2(l.c*l.q)}));if(!rec.length)return msg('La receta necesita al menos un insumo del inventario');if(rec.some(l=>l.sku===sku))return msg('Un producto no puede ser insumo de sí mismo');
const r=calcRes(),price=r2(nn($('#kp').value)||r.pr);if(!(price>0))return msg('Precio inválido');if(old)Object.assign(old,{desc,cost:r.u,price,rec,ex,yield:CY,svc:0,oh:r.o.oh,omin:OT,ohh:OH});else S.inv.push({sku,desc,cat:'ELABORADOS',cost:r.u,price,stock:0,min:0,rec,ex,yield:CY,oh:r.o.oh,omin:OT,ohh:OH});
log('Receta '+sku+' costo '+Q(r.u));persist();$('#dlg').classList.remove('show');CL=[];render();msg('Receta '+sku+' guardada · costo '+Q(r.u)+' · precio '+Q(price)+'. Use FABRICAR en Inventario.')}
function loadRec(sku){const p=S.inv.find(i=>i.sku===sku);CL=p.rec.map(r=>{const c=S.inv.find(x=>x.sku===r.sku);return{sku:r.sku,n:c?c.desc:r.n,c:c?c.cost:0,q:r.q}}).concat((p.ex||[]).map(e=>({sku:'',n:e.n,c:e.c,q:1})));CY=p.yield||1;OT=p.omin||0;OH=p.ohh||160;openCalc();$('#ks').value=p.sku;$('#kd').value=p.desc;$('#kp').value=p.price}
function fabricar(sku){const p=S.inv.find(i=>i.sku===sku);ask('Fabricar '+p.desc+' · 1 lote rinde '+(p.yield||1),[{k:'l',l:'Lotes a fabricar',t:'number',v:1}],v=>{const L=nn(v.l);if(!(L>0))return'Cantidad inválida';let bc=sum(p.ex||[],e=>e.c)+(p.oh||0);
for(const r of p.rec){const c=S.inv.find(x=>x.sku===r.sku);if(!c)return'Falta el insumo '+r.n;const need=r2(r.q*L);if(!c.svc&&need>c.stock)return'Insumo insuficiente: '+c.desc+' (necesita '+need+', hay '+c.stock+')';bc+=c.cost*r.q}
const y=p.yield||1,units=r2(L*y),unit=r2(bc/y);p.rec.forEach(r=>mov(r.sku,-r2(r.q*L),'FABRICACIÓN '+sku));p.cost=r2((p.cost*p.stock+unit*units)/(p.stock+units));mov(sku,units,'FABRICACIÓN '+L+' lote(s)');
log('Fabricado '+sku+' x'+units+' costo '+Q(unit));persist();render();msg('Fabricadas '+units+' u. de '+p.desc+' · costo unitario '+Q(unit))},'Fabricar')}
const conf=(t,fn,ok)=>ask(t,[],()=>{fn()},ok||'Eliminar');
function delCli(id){const c=S.cli.find(x=>x.id===id);if(cliSaldo(id)>0)return msg('Tiene saldo pendiente: cóbrelo antes de eliminar');conf('¿Eliminar al cliente '+c.name+'? Sus ventas conservan el nombre.',()=>{S.cli=S.cli.filter(x=>x.id!==id);log('Cliente eliminado '+c.name);persist();render()})}
function delProv(id){const p=S.prov.find(x=>x.id===id);if(S.bills.some(b=>b.prov===id&&billBal(b)>0))return msg('Tiene compras por pagar');conf('¿Eliminar al proveedor '+p.name+'?',()=>{S.prov=S.prov.filter(x=>x.id!==id);log('Proveedor eliminado '+p.name);persist();render()})}
function delBill(id){const b=S.bills.find(x=>x.id===id);if(b.paid>0)return msg('Tiene pagos registrados: no se elimina');const it=b.sku&&S.inv.find(x=>x.sku===b.sku);if(it&&!it.svc&&it.stock<b.qty)return msg('No hay stock suficiente para revertir la entrada de '+b.sku+'; ajuste el inventario primero');
conf('¿Eliminar esta compra'+(b.sku?' y revertir su entrada de inventario':'')+'?',()=>{if(it){const u=(b.total-b.iva)/b.qty;if(it.stock>b.qty)it.cost=r2((it.cost*it.stock-u*b.qty)/(it.stock-b.qty));mov(b.sku,-b.qty,'ELIMINA COMPRA')}S.bills=S.bills.filter(x=>x.id!==id);log('Compra eliminada '+Q(b.total));persist();render()})}
function delExp(id){const e=S.exp.find(x=>x.id===id);conf('¿Eliminar este gasto de '+Q(e.amt)+'?'+(e.method==='efectivo'?' El efectivo vuelve a la caja.':''),()=>{S.gem.forEach(g=>{if(g.link===id)delete g.link});S.exp=S.exp.filter(x=>x.id!==id);log('Gasto del día eliminado '+Q(e.amt));persist();render()})}
function delSale(id){const s=S.sales.find(x=>x.id===id);if(!s||s.status!=='ANULADA')return msg('Solo se eliminan ventas anuladas');conf('¿Eliminar la venta anulada '+s.no+'?',()=>{S.sales=S.sales.filter(x=>x.id!==id);S.pays=S.pays.filter(p=>!(p.type==='cobro'&&p.ref===id));log('Venta anulada eliminada '+s.no);persist();render()})}
function delCierre(i){conf('¿Eliminar este cierre de caja del historial?',()=>{S.cierres.splice(i,1);log('Cierre eliminado');persist();render()})}
const TABS=[['dash','📊 Panel'],['pos','🛒 Ventas'],['hist','🧾 Historial'],['cot','📝 Cotizaciones'],['inv','📦 Inventario'],['cli','👥 Clientes'],['cxc','💰 Por cobrar'],['cxp','🏭 Compras / Por pagar'],['gas','💸 Gastos del día'],['gem','🏢 Gastos de la empresa'],['caja','🏧 Caja'],['rep','📑 Impuestos y reportes']];
function go(t){tab=t;render()}
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');$('#cajaSt').innerHTML=S.caja?'<span class="tag ok">CAJA ABIERTA</span>':'<span class="tag er">CAJA CERRADA</span>';$('#main').innerHTML=T[tab]();if(tab==='pos'){drawProds();drawCart()}}
// ===== Nube (Supabase) =====
const CFG=window.PB_CONFIG||{},LTS='pb_ts',DRT='pb_dirty';let SB=null,USER=null,pt=null,REV=0,cloudOn=false;
function setSync(k){const e=$('#syncSt');if(!e)return;const m={ok:['☁ Sincronizado',''],save:['☁ Guardando…','wa'],err:['⚠ Sin conexión: guardado local','er'],local:['Modo local','']}[k];e.textContent=m[0];e.className='tag '+m[1]}
function cloudPersist(){if(!cloudOn||!USER)return;REV++;try{localStorage.setItem(DRT,'1')}catch(e){}setSync('save');clearTimeout(pt);pt=setTimeout(pushNow,1500)}
async function pushNow(){if(!cloudOn||!USER)return;clearTimeout(pt);const r=REV;try{const{data,error}=await SB.from('app_state').upsert({user_id:USER.id,data:S},{onConflict:'user_id'}).select('updated_at').single();if(error)throw error;localStorage.setItem(LTS,data.updated_at);if(r===REV){localStorage.removeItem(DRT);setSync('ok')}}catch(e){setSync('err')}}
function adopt(d){localStorage.setItem(KEY,JSON.stringify(d.data));localStorage.setItem(LTS,d.updated_at);localStorage.removeItem(DRT);load();render();setSync('ok')}
async function pull(){try{const{data,error}=await SB.from('app_state').select('data,updated_at').eq('user_id',USER.id).maybeSingle();if(error)throw error;
const dirty=localStorage.getItem(DRT)==='1',lts=localStorage.getItem(LTS);
if(!data){await pushNow();return}
if(!lts){adopt(data);return}
if(data.updated_at===lts){if(dirty)await pushNow();else setSync('ok');return}
if(!dirty){adopt(data);return}
ask('Este dispositivo y la nube tienen cambios distintos. ¿Usar los de la nube? (Cancelar = conservar los de este dispositivo y sobrescribir la nube)',[],()=>{adopt(data)},'Usar la nube');$('#dno').onclick=()=>{$('#dlg').classList.remove('show');pushNow()}}catch(e){setSync('err')}}
function showAuth(err,off){$('#auth').style.display='flex';$('#lo').style.display='none';$('#aerr').textContent=err||'';$('#aoff').style.display=off?'':'none'}
function offline(){$('#auth').style.display='none';cloudOn=false;setSync('local');render()}
async function start(){$('#auth').style.display='none';$('#lo').style.display='';setSync('save');await pull();render()}
async function login(){const em=cl($('#ae').value,120),pw=$('#ap').value;if(!em||!pw){$('#aerr').textContent='Escriba su correo y contraseña';return}
try{const{data,error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error||!data||!data.user){$('#aerr').textContent='Correo o contraseña incorrectos';return}USER=data.user;$('#ap').value='';await start()}catch(e){$('#aerr').textContent='No se pudo conectar. Revise su internet.'}}
async function logout(){await pushNow();if(localStorage.getItem(DRT)==='1'){msg('Hay cambios sin sincronizar: no se cerró la sesión. Revise su conexión.');return}try{await SB.auth.signOut()}catch(e){}localStorage.removeItem(KEY);localStorage.removeItem(LTS);USER=null;location.reload()}
async function boot(){cloudOn=!!(CFG.url&&CFG.key);if(!cloudOn){setSync('local');render();return}
if(!window.supabase){showAuth('No se pudo cargar Supabase. Revise su conexión.',true);return}
SB=window.supabase.createClient(CFG.url,CFG.key);SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&USER){USER=null;showAuth('Su sesión terminó. Inicie sesión de nuevo.')}});
try{const{data}=await SB.auth.getSession();if(data&&data.session){USER=data.session.user;await start()}else showAuth()}catch(e){showAuth('No se pudo conectar. Revise su internet.',true)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&USER)pull()});
load();boot();
</script></body></html>
